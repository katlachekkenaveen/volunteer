services:
  - type: web
    name: volunteer-management-system
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m backend.seed"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./volunteers.db
      - key: SECRET_KEY
        value: super-secret-jwt-key-change-in-production-2026
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ADMIN_REGISTRATION_KEY
        value: admin-secret-key-2026
