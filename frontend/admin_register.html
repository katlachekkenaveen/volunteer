<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Registration - VolunteerConnect</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center py-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
            <i class="bi bi-shield-lock-fill text-primary fs-2"></i>
            <span class="fs-3 fw-extrabold text-dark">Volunteer<span class="text-primary">Connect</span></span>
          </a>
          <p class="text-muted small">System Administrator Account Registration</p>
        </div>

        <div class="card glass-card border-0 shadow-lg overflow-hidden">
          <div class="card-header bg-dark text-white p-4">
            <h5 class="fw-bold mb-1"><i class="bi bi-person-badge-fill text-primary me-2"></i>New Administrator Registration</h5>
            <p class="text-white-50 extra-small mb-0">Requires a valid system Admin Registration Key.</p>
          </div>

          <div class="card-body p-4 p-md-5">
            <form id="admin-register-form">
              
              <div class="mb-3">
                <label for="admin-reg-name" class="form-label fw-semibold">Full Name *</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="admin-reg-name" placeholder="System Admin Name" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="admin-reg-email" class="form-label fw-semibold">Email Address *</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="admin-reg-email" placeholder="admin@example.com" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="admin-reg-password" class="form-label fw-semibold">Password *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="admin-reg-password" placeholder="Min. 6 chars" required minlength="6">
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="admin-reg-confirm-password" class="form-label fw-semibold">Confirm Password *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="admin-reg-confirm-password" placeholder="Repeat password" required minlength="6">
                  </div>
                </div>
              </div>

              <div class="mb-4">
                <label for="admin-reg-key" class="form-label fw-semibold text-danger">
                  <i class="bi bi-key-fill me-1"></i> Admin Registration Key *
                </label>
                <input type="password" class="form-control border-danger-subtle" id="admin-reg-key" placeholder="Enter authorization key" required>
                <div class="form-text extra-small text-muted">Obtain the security key from your system deployment setup.</div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold shadow-sm">
                Register as Administrator <i class="bi bi-shield-check me-1"></i>
              </button>

            </form>
          </div>
        </div>

        <div class="text-center mt-4 d-flex justify-content-center gap-3">
          <a href="login.html" class="text-primary text-decoration-none small fw-semibold">
            <i class="bi bi-arrow-left me-1"></i>Already an Admin? Sign In
          </a>
          <span class="text-muted">|</span>
          <a href="index.html" class="text-muted text-decoration-none small">
            Back to Homepage
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
