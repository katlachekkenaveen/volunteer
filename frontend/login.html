<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Portal - VolunteerConnect</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center py-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
            <i class="bi bi-heart-pulse-fill text-primary fs-2"></i>
            <span class="fs-3 fw-extrabold text-dark">Volunteer<span class="text-primary">Connect</span></span>
          </a>
          <p class="text-muted small">Sign in to access your portal or register as a new volunteer.</p>
        </div>

        <div class="card glass-card border-0 shadow-lg overflow-hidden">
          <div class="card-header bg-white border-bottom p-0">
            <ul class="nav nav-tabs nav-justified border-0" id="authTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active py-3 fw-bold border-0" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link py-3 fw-bold border-0" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">
                  <i class="bi bi-person-plus-fill me-2"></i>Register Volunteer
                </button>
              </li>
            </ul>
          </div>

          <div class="card-body p-4 p-md-5">
            <div class="tab-content" id="authTabContent">
              
              <!-- LOGIN PANEL -->
              <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                <form id="login-form">
                  <div class="mb-3">
                    <label for="login-email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                      <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required>
                    </div>
                  </div>

                  <div class="mb-4">
                    <label for="login-password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                      <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                    </div>
                  </div>

                  <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold shadow-sm">
                    Sign In to Portal <i class="bi bi-arrow-right me-1"></i>
                  </button>
                </form>

                <!-- Demo Account Presets -->
                <div class="mt-4 pt-3 border-top text-center">
                  <span class="small text-muted d-block mb-2">Quick Demo Credentials:</span>
                  <div class="d-flex justify-content-center gap-2 mb-3">
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCredentials('admin@volunteermsg.org', 'admin123')">
                      <i class="bi bi-shield-lock me-1"></i>Admin Demo
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillCredentials('sarah.j@example.com', 'password123')">
                      <i class="bi bi-person me-1"></i>Volunteer Demo
                    </button>
                  </div>
                  
                  <div class="p-2 bg-light rounded border text-center">
                    <span class="small text-muted">New Administrator? </span>
                    <a href="admin_register.html" class="small fw-bold text-primary text-decoration-none ms-1">
                      <i class="bi bi-shield-plus me-1"></i>Register as Admin
                    </a>
                  </div>
                </div>
              </div>

              <!-- REGISTER PANEL -->
              <div class="tab-pane fade" id="register-panel" role="tabpanel">
                <form id="register-form">
                  <div class="row g-3 mb-3">
                    <div class="col-md-6">
                      <label for="reg-name" class="form-label fw-semibold">Full Name *</label>
                      <input type="text" class="form-control" id="reg-name" placeholder="John Doe" required>
                    </div>
                    <div class="col-md-6">
                      <label for="reg-phone" class="form-label fw-semibold">Phone Number *</label>
                      <input type="tel" class="form-control" id="reg-phone" placeholder="+1 555-0199" required>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="reg-email" class="form-label fw-semibold">Email Address *</label>
                    <input type="email" class="form-control" id="reg-email" placeholder="john@example.com" required>
                  </div>

                  <div class="row g-3 mb-3">
                    <div class="col-md-6">
                      <label for="reg-skills" class="form-label fw-semibold">Primary Skills</label>
                      <input type="text" class="form-control" id="reg-skills" placeholder="e.g. First Aid, Teaching, Logistics">
                    </div>
                    <div class="col-md-6">
                      <label for="reg-availability" class="form-label fw-semibold">Availability</label>
                      <select class="form-select" id="reg-availability">
                        <option value="Weekends">Weekends</option>
                        <option value="Evenings & Weekends">Evenings & Weekends</option>
                        <option value="Weekdays">Weekdays</option>
                        <option value="Flexible">Flexible</option>
                      </select>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="reg-bio" class="form-label fw-semibold">Short Bio / Background</label>
                    <textarea class="form-control" id="reg-bio" rows="2" placeholder="Tell us briefly why you would like to volunteer..."></textarea>
                  </div>

                  <div class="row g-3 mb-4">
                    <div class="col-md-6">
                      <label for="reg-password" class="form-label fw-semibold">Password *</label>
                      <input type="password" class="form-control" id="reg-password" placeholder="Min. 8 chars (letters & numbers)" required minlength="8">
                    </div>
                    <div class="col-md-6">
                      <label for="reg-confirm-password" class="form-label fw-semibold">Confirm Password *</label>
                      <input type="password" class="form-control" id="reg-confirm-password" placeholder="Repeat password" required minlength="8">
                    </div>
                  </div>

                  <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold shadow-sm">
                    Submit Volunteer Registration <i class="bi bi-check-circle me-1"></i>
                  </button>
                </form>
              </div>

            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>Back to Homepage</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillCredentials(email, pass) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
    }

    // Auto switch tab if URL query param ?tab=register
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'register') {
      const regTab = document.getElementById('register-tab');
      if (regTab) {
        new bootstrap.Tab(regTab).show();
      }
    }
  </script>
</body>
</html>
